# The toolchain and the tasks CI and people call. Go is pinned to the patch,
# as in gokit and quoin, so CI and a laptop compile with the same compiler;
# its major.minor is the one nixpkgs' go_1_27 has on nixos-26.05, which
# flake.nix's dev shell offers to anyone without mise. The weekly update moves each tool's patch; a new minor moves by
# hand, with the nixpkgs attribute.
[tools]
go = "1.27.3"
shellcheck = "0.11.0"
actionlint = "1.7.12"

[env]
# Static binaries with no libc (D1): a copied-over mosey (D7) must
# run on any Linux, whatever its libc.
CGO_ENABLED = "0"

[tasks.check]
description = "Lint, unit tests, the runtimesecret build's checks, shellcheck, actionlint and the scripts' tests: the dev loop and CI's fast job"
depends = ["lint", "test", "secret", "shellcheck", "actionlint", "actions-pinned", "scripts-test"]

# Vetted for both operating systems and both architectures every release
# ships for (D10), so a Linux-only call outside a _linux.go file fails here
# and not in the build job. The spikes are records with their own modules,
# and are neither formatted nor vetted.
[tasks.lint]
description = "gofmt, and go vet for linux and darwin on amd64 and arm64"
sources = ["cmd/**/*.go", "internal/**/*.go", "go.mod", "go.sum"]
outputs = { auto = true }
run = [
  'test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal >&2; echo "not gofmt-ed" >&2; exit 1; }',
  'for os in linux darwin; do for arch in amd64 arm64; do GOOS=$os GOARCH=$arch go vet ./... || exit 1; done; done',
]

# Linux releases are built with GOEXPERIMENT=runtimesecret (D20,
# scripts/build.sh), which compiles internal/handshake's secret_on.go in
# place of secret_off.go: so that configuration is vetted and the packages
# that hold keys are tested in it too. The experiment is linux-only; on any
# other host there is nothing to check.
[tasks.secret]
description = "vet and the key-holding packages' tests as linux releases build them, with GOEXPERIMENT=runtimesecret"
run = '''
[ "$(uname -s)" = Linux ] || { echo "runtimesecret is linux-only: nothing to check here"; exit 0; }
export GOEXPERIMENT=runtimesecret
for arch in amd64 arm64; do GOOS=linux GOARCH=$arch go vet ./... || exit 1; done
go test ./internal/handshake ./internal/transport ./internal/client ./internal/server
'''

[tasks.test]
description = "go test, every package"
run = "go test ./..."

# The race detector's runtime is C, so this is the one task that turns cgo
# on, for itself, and needs a C compiler (CI's race job has gcc; locally,
# `nix shell nixpkgs#gcc -c mise run race`). Nothing it builds ships: every
# release stays static (D1). Tests that run a sandboxed copy of the test
# binary skip under -race (internal/server's raceEnabled), and the sandbox's
# own tests skip in a cgo build, so kill-soak, not this, covers those.
[tasks.race]
description = "go test -race, every package (needs cgo and a C compiler: CI's race job)"
run = "CGO_ENABLED=1 go test -race ./..."

[tasks.test-slow]
description = "The tests that wait in real time (an abandoned session's 30 s credential), skipped by test"
run = "MOSEY_SLOW_TESTS=1 go test -count=1 -run TestAnAbandonedSessionEndsByItself ./internal/e2e"

[tasks.fuzz-smoke]
description = "Every fuzz target for FUZZTIME each (default 10s): a smoke test, not a campaign"
run = "scripts/fuzz.sh"

[tasks.shellcheck]
description = "shellcheck the scripts"
sources = ["scripts/*.sh"]
outputs = { auto = true }
run = "shellcheck scripts/*.sh"

# actionlint runs shellcheck over every run: block too, so a workflow's
# shell is held to the scripts' standard.
[tasks.actionlint]
description = "actionlint the workflows"
sources = [".github/workflows/*.yml"]
outputs = { auto = true }
run = "actionlint"

# Every action pinned by commit, in every job (S1): the release job attests
# what the build job made, so a moved tag anywhere upstream of it could get
# a binary of its choosing attested. The script says more.
[tasks.actions-pinned]
description = "Every workflow's uses: names a commit SHA with its release as a comment"
sources = [".github/workflows/*.yml", "scripts/actions-pinned.sh"]
outputs = { auto = true }
run = "scripts/actions-pinned.sh"

[tasks.build]
description = "The static mosey binary for linux and darwin on amd64 and arm64, in dist/"
run = "scripts/build.sh"

# What counts as a release's input (the source, the Go pin, the build and
# version scripts, flake.nix) is listed, and argued, in the script; the
# last release is its tag's parent (scripts/last-release.sh).
[tasks.release-due]
description = "Exit 0, printing true, if anything a release is built from changed since the last release tag; else print false and exit 1"
run = "scripts/release-due.sh"

[tasks.scripts-test]
description = "The release scripts' own tests, against a throwaway repository and a known SHA256SUMS"
run = ["scripts/release-due-test.sh", "scripts/release-json-test.sh"]
