# The weekly update, in the window every danielbodart repo shares, Sunday
# 21:23 UTC, as quoin's, frisket's and chase's: every dependency of every
# kind moves at once. nix-config takes its own at 23:23 on the same
# nixos-26.05. Its mosey is a release's binary, pinned by tag (flake.nix),
# so nothing here is built for it.
#
# What moves, in order: every flake input (nix flake update); each
# mise.toml tool to the latest patch of its pinned minor (a new minor moves
# by hand, with the nixpkgs attribute flake.nix builds with); and every Go
# dependency (go get -u) but the two D23 pins. mosey requires none of Dan's
# own modules (D17), so there is no scripts/pin.sh step.
#
# Held: tuios.dev/vt, the shipped emulator, which D23 pins, and
# go.mitchellh.com/libghostty, its oracle, whose binding names the commit
# of the library the local oracle test builds. Each moves by hand, with the
# corpus and the oracle run against it.
#
# The gate is everything CI runs that can fail on a dependency: check, the
# slow tests, the fuzz smoke test, the race detector, the KILL soak and
# the VM test of the binaries it builds, on this one runner, slower than CI's legs, but nobody is
# waiting on it. Only if it passes is anything committed, straight to
# trunk, never as a pull request.
#
# A push made with GITHUB_TOKEN starts no workflow, so the last step
# dispatches CI on trunk with `release`, which checks the commit and
# releases it -- but only if scripts/release-due.sh says something a
# release is built from changed since the last tag. The binaries are built
# by mise's Go, so a week that moved Go's patch (often a crypto or net
# security fix) releases; one in which only flake.lock, or only shellcheck
# or actionlint, moved releases nothing, since the flake's package is the
# release's binary whatever nixpkgs is, and the linters change no binary.
name: Weekly update

on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with anything else that commits to trunk.
concurrency:
  group: update

# A run shell is bash -eo pipefail: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # The Go mise.toml pins, never one go.mod's toolchain line downloads.
      GOTOOLCHAIN: local
    steps:
      # The whole history and its tags, for mise run release-due.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Move everything
        id: update
        run: |
          moved=()
          gomods() { go mod edit -json | jq -r '.Require[] | "\(.Path) \(.Version)"' | sort; }

          # 1. The flake's inputs.
          nix flake update 2>&1 | tee update.log
          mapfile -t inputs < <(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2)
          moved+=("${inputs[@]}")

          # 2. mise's tools, each to the latest patch of its pinned
          # major.minor (go 1.27.3 asks for 1.27).
          while read -r tool was; do
            now=$(mise latest "$tool@$(cut -d. -f1-2 <<<"$was")")
            if [ -n "$now" ] && [ "$now" != "$was" ]; then
              sed -i -E "s|^(\"?$tool\"? = )\"$was\"|\1\"$now\"|" mise.toml
              moved+=("$tool $was -> $now")
            fi
          done < <(sed -n -E '/^\[tools\]/,/^\[/s/^"?([a-z0-9_:-]+)"? = "([0-9.]+)"$/\1 \2/p' mise.toml)
          mise install

          # 3. Every Go dependency but the held ones (see the header).
          before=$(gomods)
          held=()
          for m in tuios.dev/vt go.mitchellh.com/libghostty; do
            held+=("$m@$(go list -m -f '{{.Version}}' "$m")")
          done
          go get -u ./...
          go get "${held[@]}"
          go mod tidy
          mapfile -t mods < <(comm -13 <(echo "$before") <(gomods) | cut -d' ' -f1)
          moved+=("${mods[@]}")

          # 4.
          if git diff --quiet; then
            echo "Nothing moved."
            exit 0
          fi
          list=$(printf '%s\n' "${moved[@]}" | { grep . || true; } | paste -sd, - | sed 's/,/, /g')
          echo "moved=${list:-dependencies}" >> "$GITHUB_OUTPUT"

      # 5. The gate: what CI runs that a dependency can break.
      - name: mise run check
        if: steps.update.outputs.moved
        run: mise run check

      - name: mise run test-slow
        if: steps.update.outputs.moved
        run: mise run test-slow

      - name: mise run fuzz-smoke
        if: steps.update.outputs.moved
        run: mise run fuzz-smoke

      - name: mise run race
        if: steps.update.outputs.moved
        run: mise run race

      # amd64 only here; CI soaks arm64 too before the release it dispatches.
      - name: KILL soak
        if: steps.update.outputs.moved
        run: mise exec -- scripts/soak.sh --scope 150s

      # As CI's nix job: the binaries, built as the build job builds them,
      # made the flake's release (scripts/nix-local-release.sh, which
      # stages a nix/release.json that the commit below must not take),
      # then every check, the dev shell and the formatter.
      - name: Build what CI builds
        if: steps.update.outputs.moved
        run: |
          mise exec -- scripts/build.sh
          V="$(scripts/version.sh)"
          scripts/release-assets.sh "$V" "$RUNNER_TEMP/release" dist
          scripts/nix-local-release.sh "$V" "$RUNNER_TEMP/release"
          mapfile -t checks < <(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames | jq -r '.[]')
          nix build --no-link --print-build-logs "${checks[@]/#/.#checks.x86_64-linux.}" \
            .#packages.x86_64-linux.mosey .#devShells.x86_64-linux.default .#formatter.x86_64-linux
          scripts/nix-eval-systems.sh
          git rm -q --cached nix/release.json
          rm -rf nix/release.json dist

      # 6.
      - name: Commit and push
        if: steps.update.outputs.moved
        env:
          MOVED: ${{ steps.update.outputs.moved }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Weekly update: $MOVED"
          git pull -q --rebase origin trunk
          git push -q origin HEAD:trunk

      # 7. A release, if anything a release is built from moved (Go's pin
      # among them): CI checks the pushed commit and releases it. A week
      # that moved only flake.lock or the linters releases nothing.
      - name: Release, if anything it is built from moved
        if: steps.update.outputs.moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if mise run release-due; then gh workflow run ci.yml --ref trunk -f release=true; fi
