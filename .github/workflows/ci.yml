name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  # A dispatch is checked and built as a push is; `release` releases even if
  # nothing a release is built from (scripts/release-due.sh) changed since
  # the last release.
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false

# Least privilege for the built-in token: read-only by default, and widened
# only on the job that publishes a release.
permissions:
  contents: read

# A run shell is bash -eo pipefail: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # gofmt, vet for every platform a release ships for, the tests, vet and
  # the key-holding packages' tests again as linux releases are built (with
  # GOEXPERIMENT=runtimesecret), and shellcheck, through mise, the dev
  # loop's toolchain. The tests that need
  # an sshd (the end-to-end bootstrap) start a throwaway one on loopback,
  # and skip if the runner has none.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run check

  # The tests that wait in real time, kept out of check so the dev loop
  # stays quick: an abandoned session's real processes ending once its
  # credential expires (30 s of wall clock; the same path runs in virtual
  # time in check).
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run test-slow

  # Every fuzz target for a few seconds: enough to catch a parser that
  # panics on its own seed corpus or on the first mutations. Real campaigns
  # run locally for minutes per target before a parser lands (CLAUDE.md),
  # and continuously before 1.0 (PLAN §6.5).
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run fuzz-smoke
        env:
          FUZZTIME: 10s

  # The tests again under the race detector. Its runtime is C, so this job
  # alone builds with cgo (mise run race sets CGO_ENABLED=1 for itself; the
  # runner has gcc); nothing it builds ships, and every release stays
  # static (D1). The tests that run a sandboxed copy of the test binary skip
  # under -race (internal/server's raceEnabled; internal/sandbox's
  # requireSeccomp), because the race runtime makes syscalls the release
  # policies rightly leave out, and a cgo build cannot apply NO_NEW_PRIVS
  # to every thread: the kill-soak job covers those, as released.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run race

  # The KILL soak of D22 and server.md §9: the real server with its roles
  # under seccomp Kill, carrying a busy session for 150 s inside a scope
  # with a CPU quota (so the runtime's pread64 of cpu.max runs), on amd64
  # and on arm64 hardware, so every Go upgrade, dependency bump and policy
  # change is soaked on both before it can release. The binaries run Kill
  # on both architectures (sandbox/action.go); this job is what keeps that
  # safe, so a release waits on it.
  kill-soak:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- scripts/soak.sh --scope 150s

  # Static binaries for every platform a release ships for (D1, D10), kept
  # as the run's artifacts whether or not the commit is released.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    steps:
      # The whole history, because the version's minor is the commit count;
      # scripts/version.sh refuses a shallow clone rather than stamp a wrong
      # version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Build ${{ matrix.target }}
        run: scripts/build.sh "${{ matrix.target }}"
      - name: Name the artifact
        id: name
        env:
          TARGET: ${{ matrix.target }}
        run: echo "value=mosey-${TARGET/\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.value }}
          path: dist/
          if-no-files-found: error

  # What `nix flake check` checks, split across runners as in chase and
  # quoin: the VM test of D7's install path and the package's own test run
  # are each minutes, so each is a leg of its own, and `rest` builds every
  # check the others do not name (so a check added to the flake is built
  # without being added here), the package, the dev shell and the
  # formatter.
  nix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [vm-install, tests, rest]
    env:
      # Empty where the repository has no such secret (a fork, or before
      # it is added): the cache is then read anonymously and nothing is
      # pushed.
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # install-nix-action gives the runner's /dev/kvm to the build user, so
      # the VM test runs under KVM rather than emulated.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # The danielbodart cache, read-only here: the free tier is 5 GB, so
      # only mosey's own package is pushed, by the rest leg's last step,
      # never a VM test's closure.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: nix build .#checks.x86_64-linux.${{ matrix.check }}
        if: matrix.check != 'rest'
        env:
          CHECK: ${{ matrix.check }}
        run: nix build --print-build-logs --no-link ".#checks.x86_64-linux.$CHECK"

      # Every check the other legs do not build, and the other outputs `nix
      # flake check` would evaluate, built rather than only evaluated.
      - name: the other checks and outputs
        if: matrix.check == 'rest'
        run: |
          nix eval --json '.#checks.x86_64-linux' --apply 'cs: builtins.attrNames (removeAttrs cs [ "vm-install" "tests" ])' \
            | jq -r '.[] | ".#checks.x86_64-linux." + .' \
            | xargs nix build --print-build-logs --no-link \
                .#packages.x86_64-linux.mosey .#devShells.x86_64-linux.default .#formatter.x86_64-linux

      # The other systems the flake offers (aarch64-linux, aarch64-darwin)
      # are evaluated, not built: no runner here is either, and an
      # evaluation error is what a change to the flake most often breaks.
      - name: the other systems, evaluated
        if: matrix.check == 'rest'
        run: scripts/nix-eval-systems.sh

      # The package a host installs, from the rest leg, which builds it.
      - name: Push mosey's package to Cachix
        if: matrix.check == 'rest' && env.CACHIX_AUTH_TOKEN != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        run: nix build --no-link --print-out-paths .#mosey | cachix push danielbodart

  # CONTINUOUS RELEASE (D10). Trunk-based: every push to trunk that passes
  # every job above and changed what a release is built from since the last
  # one (scripts/release-due.sh: the source, Go's pin, the build) is
  # published, with no manual step and no tag cut by hand, as in quoin,
  # frisket and chase. Gated on a push or a dispatch on trunk (never
  # a pull request) and on every job having succeeded, so a red commit
  # never ships.
  #
  # Unlike those, which ship through Nix and release only a tag, a mosey
  # release carries its binaries, because D7 copies them onto hosts that
  # have no Nix. The assets are fixed by docs/spec/bootstrap.md §4.6, and the
  # auto-upload slice computes their URLs from them, so do not rename them:
  #
  #   tag      v<V>, V = scripts/version.sh (major.commit-count.run-number)
  #   binary   mosey-<V>-<os>-<arch>, os in linux/darwin, arch in amd64/arm64
  #            (Go's names), the bare static executable the build job made
  #   sums     SHA256SUMS, sha256sum(1) format, one line per binary
  #   bundle   mosey-<V>-<os>-<arch>.sigstore.json, the binary's Sigstore
  #            bundle: SLSA provenance from this workflow on trunk, which
  #            the client verifies before copying a downloaded binary (S1)
  #
  # i.e. https://github.com/danielbodart/mosey/releases/download/v<V>/mosey-<V>-<os>-<arch>.
  # scripts/release-assets.sh lays them out and refuses to go on unless the
  # linux/amd64 binary says it is V and each other binary contains V: the
  # build job stamped every one from the same commit and run number, so
  # they agree, and the check keeps it so.
  #
  # The derived version makes every run a unique, monotonic release, so two
  # pushes cannot collide on a tag. A re-run of a run keeps its run number:
  # re-running one whose release was already made fails at gh release
  # create, which never overwrites a release.
  release:
    needs: [check, slow, fuzz-smoke, race, kill-soak, build, nix]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To start CI on trunk's head, where this commit cannot be tagged.
      actions: write
      # To attest every asset (D7, S1): an OIDC token, which Fulcio turns
      # into a certificate naming this workflow on trunk, and the right to
      # store the attestations with the repository's.
      id-token: write
      attestations: write
    # Every action in this job is pinned by commit, not by tag: the job
    # holds id-token: write, so any step's code could mint a Fulcio
    # certificate for exactly the identity the client trusts
    # (internal/provenance.Identity) and attest a binary of its choosing.
    # A moved tag must not be able to do that. Bumping one is a reviewed
    # change of its SHA; the comment says which release it is. The tools
    # mise-action installs (mise.toml: Go, shellcheck, actionlint, pinned
    # by exact version) run here too and are trusted the same way.
    steps:
      # fetch-depth: 0 because the minor is the commit count, which
      # scripts/version.sh REFUSES to count in a shallow clone; fetch-tags so
      # the previous tag resolves, for release-due and the notes below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # For mise run release-due.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      # The build job's four binaries, one directory per artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: mosey-*

      # Whether to release, and if so the assets, laid out and checked.
      #
      # GitHub refuses GITHUB_TOKEN, which can never hold the workflows
      # permission, a new ref whose .github/workflows differ from trunk's
      # head ("HTTP 403: Resource not accessible by integration"): a tag of
      # this commit, once trunk has moved on to a commit that changed a
      # workflow, would be one. Then the release is trunk head's to make,
      # its commits including this one's: its own run makes it, or, where it
      # has none (a [skip ci] push, a push made with GITHUB_TOKEN), one
      # started here.
      - name: Decide, and lay out the assets
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.release || false }}
        run: |
          if [ "$FORCE" != true ] && ! mise run release-due; then
            echo "Nothing a release is built from changed since the last release: no release."
            exit 0
          fi
          git fetch -q origin trunk
          head=$(git rev-parse FETCH_HEAD)
          if [ "$head" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" "$head" -- .github/workflows; then
            echo "::warning::trunk is at ${head:0:7}, which changed a workflow since ${GITHUB_SHA:0:7}: GITHUB_TOKEN cannot tag ${GITHUB_SHA:0:7}, so the release is ${head:0:7}'s"
            if [ "$(gh run list --workflow ci.yml --commit "$head" --json databaseId --jq length)" = 0 ]; then
              gh workflow run ci.yml --ref trunk -f release="$FORCE"
            fi
            exit 0
          fi
          V="$(./scripts/version.sh)"
          scripts/release-assets.sh "$V" release artifacts
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # SLSA build provenance for each binary (D7, S1, bootstrap.md §4.6),
      # one attestation per binary so each bundle names exactly the file it
      # sits next to. Signed by the public-good Sigstore (the repository is
      # public): a Fulcio certificate for this workflow on refs/heads/trunk,
      # logged in Rekor. Pinned by commit, as is every action in this job.
      # A failure here fails the job, so nothing below runs and no
      # unattested asset is published.
      - name: Attest linux/amd64
        id: attest-linux-amd64
        if: steps.due.outputs.version
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/mosey-${{ steps.due.outputs.version }}-linux-amd64
      - name: Attest linux/arm64
        id: attest-linux-arm64
        if: steps.due.outputs.version
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/mosey-${{ steps.due.outputs.version }}-linux-arm64
      - name: Attest darwin/amd64
        id: attest-darwin-amd64
        if: steps.due.outputs.version
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/mosey-${{ steps.due.outputs.version }}-darwin-amd64
      - name: Attest darwin/arm64
        id: attest-darwin-arm64
        if: steps.due.outputs.version
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/mosey-${{ steps.due.outputs.version }}-darwin-arm64

      # Each bundle next to its binary as mosey-<V>-<os>-<arch>.sigstore.json,
      # each checked as the client will check it, against the trusted root
      # this commit embeds: a release its own clients would refuse is not
      # made.
      - name: Bundles next to their binaries, checked
        if: steps.due.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.due.outputs.version }}
          LINUX_AMD64: ${{ steps.attest-linux-amd64.outputs.bundle-path }}
          LINUX_ARM64: ${{ steps.attest-linux-arm64.outputs.bundle-path }}
          DARWIN_AMD64: ${{ steps.attest-darwin-amd64.outputs.bundle-path }}
          DARWIN_ARM64: ${{ steps.attest-darwin-arm64.outputs.bundle-path }}
        run: |
          scripts/release-bundles.sh "$V" release \
            "linux-amd64=$LINUX_AMD64" "linux-arm64=$LINUX_ARM64" \
            "darwin-amd64=$DARWIN_AMD64" "darwin-arm64=$DARWIN_ARM64"

      # Notes from the COMMITS since the last release. Trunk-based means
      # direct pushes and no pull requests, so GitHub's PR-based
      # --generate-notes would come out empty. On the first release there is
      # no prior tag, so fall back to the head commit rather than dumping the
      # whole history.
      - name: Create GitHub Release
        if: steps.due.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.due.outputs.version }}
        run: |
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log "$PREV..HEAD" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)'; } > notes.md
          fi
          {
            echo
            echo "Static binaries for linux and darwin on amd64 and arm64, each with its Sigstore build provenance (.sigstore.json)."
            echo "To check what you downloaded: sha256sum --ignore-missing -c SHA256SUMS, and gh attestation verify FILE --repo danielbodart/mosey"
          } >> notes.md
          gh release create "v$V" --title "v$V" --notes-file notes.md --target "$GITHUB_SHA" release/*
