name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  # A dispatch is checked and built as a push is; `release` releases even if
  # nothing a release is built from (scripts/release-due.sh) changed since
  # the last release.
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false

# Every action is pinned by commit with its release as a comment, never by
# tag (the release job says why; scripts/actions-pinned.sh enforces it).
#
# Least privilege for the built-in token: read-only by default, and widened
# only on the job that publishes a release.
permissions:
  contents: read

# One run per ref at a time: a newer push to trunk (or a dispatch on it)
# cancels the older trunk run that is still testing, and a pull request's
# newer push cancels its older run, each pull request in a group of its own.
# Commits reach trunk one push at a time, and every run starts every job, so
# without this a burst of pushes queued a dozen runs' jobs behind each
# other for the runner limit, each to test a commit the next one replaces.
# Nothing is lost: the newer run releases everything since the last
# release (scripts/release-due.sh diffs against the commit the last tag
# released, not the previous commit, and the notes list every commit since
# it), so the green tip of trunk is what gets released.
#
# The cancellation must never stop a release half-way: a release whose
# tag exists without all its binaries, or whose binaries are not all
# attested, is a broken release that clients compute URLs for. GitHub
# cancels a run by re-evaluating each running job's and step's `if:` and
# stopping those that come out false; a bare `if:` means success(), which
# is false once the run is cancelled. So the release job's `if:` starts
# with always(), and each of its steps' with !failure(): once the release
# job has started, the cancellation evaluates them true and the job runs to
# the end, while any failure of its own still stops it. A run cancelled
# before its release job started skips it, because a job it needs was
# cancelled. Its own concurrency group, which never cancels, queues one
# run's release behind another's, so the second sees the first's tag.
# (A separate workflow on workflow_run would also escape the cancellation,
# but would attest, as itself, binaries another run built, and would need
# that run's version and inputs passed across; this keeps the build, the
# attestation and the release in one run.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A run shell is bash -eo pipefail: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

# Every Go job restores Go's build and module caches (GOCACHE, GOMODCACHE),
# keyed on the Go version and go.sum, with one key per kind of job, because
# each builds differently (-race, fuzz instrumentation, cross-compiles) and
# would otherwise overwrite another's. A miss falls back to the newest cache
# of the same kind, then of any kind. Where the key already exists nothing
# is saved, so the cache holds the modules and what they compile to, and
# whatever of mosey's own packages the first run of that go.sum built;
# go's own hashing decides what is still valid, as it does on a laptop.
# mise-action caches only mise's tools, so this is actions/cache.

jobs:
  # gofmt, vet for every platform a release ships for, the tests, vet and
  # the key-holding packages' tests again as linux releases are built (with
  # GOEXPERIMENT=runtimesecret), and shellcheck, through mise, the dev
  # loop's toolchain. The tests that need an sshd (the end-to-end
  # bootstrap) start a throwaway one on loopback, and skip if the runner has
  # none.
  #
  # Then the tests that wait in real time, kept out of mise run check so the
  # dev loop stays quick: an abandoned session's real processes ending once
  # its credential expires (30 s of wall clock; the same path runs in
  # virtual time in check). They are here rather than on a runner of their
  # own, which spent longer starting than testing.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - id: go
        run: |
          {
            echo "version=$(mise exec -- go env GOVERSION)"
            echo "build=$(mise exec -- go env GOCACHE)"
            echo "mod=$(mise exec -- go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-check-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-check-
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - run: mise run check
      - run: mise run test-slow

  # The tests again under the race detector. Its runtime is C, so this job
  # alone builds with cgo (mise run race sets CGO_ENABLED=1 for itself; the
  # runner has gcc); nothing it builds ships, and every release stays
  # static (D1). The tests that run a sandboxed copy of the test binary skip
  # under -race (internal/server's raceEnabled; internal/sandbox's
  # requireSeccomp), because the race runtime makes syscalls the release
  # policies rightly leave out, and a cgo build cannot apply NO_NEW_PRIVS
  # to every thread: the kill-soak job covers those, as released.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - id: go
        run: |
          {
            echo "version=$(mise exec -- go env GOVERSION)"
            echo "build=$(mise exec -- go env GOCACHE)"
            echo "mod=$(mise exec -- go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-race-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-race-
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - run: mise run race

  # Every fuzz target for 10 s: enough to catch a parser that panics on its
  # own seed corpus or on the first mutations. Real campaigns run locally for
  # minutes per target before a parser lands (CLAUDE.md), and every night
  # for 5 minutes each (fuzz-nightly.yml).
  #
  # One after another the targets took nine minutes, the longest job by
  # far, with go test -fuzz rebuilding the package for each. So this job
  # lists them (scripts/fuzz-targets.sh, which scripts/fuzz.sh uses too) and
  # deals them into four shards, balanced by an estimate of each shard's
  # time, and the fuzz job runs one shard per runner, each building a
  # package's instrumented test binary once for all of that package's
  # targets in the shard (scripts/fuzz.sh). Listing compiles the packages'
  # tests, which is what check's cache holds, so it restores that and saves
  # nothing.
  fuzz-targets:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - id: go
        run: |
          {
            echo "version=$(mise exec -- go env GOVERSION)"
            echo "build=$(mise exec -- go env GOCACHE)"
            echo "mod=$(mise exec -- go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-check-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-check-
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - id: list
        run: |
          shards=$(mise exec -- scripts/fuzz-targets.sh --shards 4)
          echo "$shards" | jq .
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: fuzz-targets
    name: fuzz (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fuzz-targets.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - id: go
        run: |
          {
            echo "version=$(mise exec -- go env GOVERSION)"
            echo "build=$(mise exec -- go env GOCACHE)"
            echo "mod=$(mise exec -- go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-fuzz-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-fuzz-
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - name: Fuzz this shard's targets
        env:
          FUZZTIME: 10s
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<<"$TARGETS"
          [ ${#targets[@]} -gt 0 ] || { echo "an empty shard would fuzz everything" >&2; exit 1; }
          mise exec -- scripts/fuzz.sh "${targets[@]}"
      # A crasher is written to the package's testdata/fuzz/<Target>/, the
      # path it is committed at as a regression seed: unzip it at the root.
      - name: Collect any crasher
        if: failure()
        run: |
          mkdir -p crashers
          git ls-files -z --others --exclude-standard -- cmd internal \
            | { grep -z '/testdata/fuzz/' || true; } \
            | xargs -0r cp --parents -t crashers/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-shard-${{ matrix.shard }}
          path: crashers/
          if-no-files-found: ignore

  # The KILL soak of D22 and server.md §9: the real server with its roles
  # under seccomp Kill, carrying a busy session for 150 s inside a scope
  # with a CPU quota (so the runtime's pread64 of cpu.max runs), on amd64
  # and on arm64 hardware, so every Go upgrade, dependency bump and policy
  # change is soaked on both before it can release. The binaries run Kill
  # on both architectures (sandbox/action.go); this job is what keeps that
  # safe, so a release waits on it. Each of the two soaks, the whole
  # server's and emu's alone, has a runner of its own, so both take 150 s
  # side by side rather than 300 s one after the other.
  kill-soak:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        test: [TestKillSoak, TestEmuKillSoak]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - id: go
        run: |
          {
            echo "version=$(mise exec -- go env GOVERSION)"
            echo "build=$(mise exec -- go env GOCACHE)"
            echo "mod=$(mise exec -- go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-soak-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-soak-
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - env:
          TEST: ${{ matrix.test }}
        run: mise exec -- scripts/soak.sh --scope --test "$TEST" 150s

  # Static binaries for every platform a release ships for (D1, D10), kept
  # as the run's artifacts whether or not the commit is released: one job
  # cross-compiles all four (each took longer to start than to build), and
  # uploads each as the artifact it was when each had a job of its own,
  # mosey-<os>-<arch> holding <os>-<arch>/mosey, which is what the release
  # job and scripts/release-assets.sh look for.
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the version's minor is the commit count;
      # scripts/version.sh refuses a shallow clone rather than stamp a wrong
      # version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - id: go
        run: |
          {
            echo "version=$(mise exec -- go env GOVERSION)"
            echo "build=$(mise exec -- go env GOCACHE)"
            echo "mod=$(mise exec -- go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-build-
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - name: Build all four
        run: |
          mise exec -- scripts/build.sh
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            mkdir -p "upload/mosey-$p"
            mv "dist/$p" "upload/mosey-$p/"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mosey-linux-amd64
          path: upload/mosey-linux-amd64/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mosey-linux-arm64
          path: upload/mosey-linux-arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mosey-darwin-amd64
          path: upload/mosey-darwin-amd64/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mosey-darwin-arm64
          path: upload/mosey-darwin-arm64/
          if-no-files-found: error

  # What needs Nix to check, split across runners as in chase and quoin.
  # The flake's package is a release's binary, not a build from source
  # (flake.nix says why): it exists only where nix/release.json does, which
  # on GitHub is a release tag's own commit. So each leg first makes this
  # checkout a release of the binaries this run's build job made,
  # scripts/nix-local-release.sh: it writes and stages nix/release.json for
  # them, as the release job will, and adds each binary to the store at the
  # path fetchurl would download it to, which is content-addressed, so only
  # the file whose hash release.json names can stand there and nothing is
  # fetched. The VM test thus runs the very binary this run releases,
  # through the same release.json, fetchurl and install a pinned tag uses,
  # and no flake output exists only for CI. (The alternatives were an
  # --impure build reading the binary's path from the environment, or a
  # flake input overridden with --override-input; both are a second way
  # into the package that a tag never takes.)
  #
  # The VM test of D7's install path is minutes, so it is a leg of its own;
  # `rest` evaluates the flake as trunk has it (no release.json: no package,
  # no checks) and then as a release has it, on every system, builds the
  # package, the dev shell and the formatter, and builds every check the
  # other legs do not name (so a check added to the flake is built without
  # being added here). The tests, gofmt and vet are check's.
  #
  # Nothing is pushed to Cachix any more: there is no source build to
  # cache, and the binary comes from the release. The danielbodart cache's
  # CACHIX_AUTH_TOKEN secret is still set on the repository, unused.
  nix:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [vm-install, rest]
    steps:
      # The whole history: scripts/version.sh counts it, to name the
      # binaries' version as the build job did.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # install-nix-action gives the runner's /dev/kvm to the build user, so
      # the VM test runs under KVM rather than emulated.
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - name: The flake as trunk has it, evaluated
        if: matrix.check == 'rest'
        run: nix flake check --no-build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: mosey-*

      - name: This run's binaries as the flake's release
        run: |
          V="$(scripts/version.sh)"
          scripts/release-assets.sh "$V" release artifacts
          scripts/nix-local-release.sh "$V" release

      - name: nix build .#checks.x86_64-linux.${{ matrix.check }}
        if: matrix.check != 'rest'
        env:
          CHECK: ${{ matrix.check }}
        run: nix build --print-build-logs --no-link ".#checks.x86_64-linux.$CHECK"

      # Every check the other legs do not build, and the other outputs `nix
      # flake check` would evaluate, built rather than only evaluated.
      - name: the other checks and outputs
        if: matrix.check == 'rest'
        run: |
          nix eval --json '.#checks.x86_64-linux' --apply 'cs: builtins.attrNames (removeAttrs cs [ "vm-install" ])' \
            | jq -r '.[] | ".#checks.x86_64-linux." + .' \
            | xargs nix build --print-build-logs --no-link \
                .#packages.x86_64-linux.mosey .#devShells.x86_64-linux.default .#formatter.x86_64-linux

      # The other systems the flake offers are evaluated, not built: no
      # runner here is any of them, and an evaluation error is what a change
      # to the flake most often breaks.
      - name: the other systems, evaluated
        if: matrix.check == 'rest'
        run: scripts/nix-eval-systems.sh

  # CONTINUOUS RELEASE (D10). Trunk-based: every push to trunk that passes
  # every job above and changed what a release is built from since the last
  # one (scripts/release-due.sh: the source, Go's pin, the build) is
  # published, with no manual step and no tag cut by hand, as in quoin,
  # frisket and chase. Gated on a push or a dispatch on trunk (never
  # a pull request) and on every job having succeeded, so a red commit
  # never ships: always() is there only so that a cancellation cannot stop
  # it once it has started (see concurrency, at the top), and the rest of
  # the condition is the success() it replaces, spelled out. A newer push
  # cancels this run's testing, not a release in progress; the newer run
  # then releases this run's commits with its own.
  #
  # Unlike those, which ship through Nix and release only a tag, a mosey
  # release carries its binaries, because D7 copies them onto hosts that
  # have no Nix, and Nix installs those same binaries (flake.nix). The
  # assets are fixed by docs/spec/bootstrap.md §4.6, and the auto-upload
  # slice computes their URLs from them, so do not rename them:
  #
  #   tag      v<V>, V = scripts/version.sh (major.commit-count.run-number),
  #            on a commit of its own (below)
  #   binary   mosey-<V>-<os>-<arch>, os in linux/darwin, arch in amd64/arm64
  #            (Go's names), the bare static executable the build job made
  #   sums     SHA256SUMS, sha256sum(1) format, one line per binary
  #
  # i.e. https://github.com/danielbodart/mosey/releases/download/v<V>/mosey-<V>-<os>-<arch>.
  # Each binary also has a GitHub build attestation, stored by GitHub and
  # not a release asset, for a person to check by hand with gh attestation
  # verify (D7 as amended 2026-11-15); the client checks only SHA256SUMS.
  # scripts/release-assets.sh lays them out and refuses to go on unless the
  # linux/amd64 binary says it is V and each other binary contains V: the
  # build job stamped every one from the same commit and run number, so
  # they agree, and the check keeps it so.
  #
  # THE TAG'S OWN COMMIT. flake.nix's package is the release's binary,
  # fetched, and a flake fetched as github:danielbodart/mosey/v<V> sees its
  # commit but not its tag, so the version and each asset's URL and hash
  # must be in the tagged tree: nix/release.json (scripts/release-json.sh).
  # It is committed, by github-actions[bot], as a one-commit child of the
  # released trunk commit, and only the tag v<V> is pushed, pointing at that
  # child; trunk never gets the commit. Agents and a push loop commit to
  # local trunk all the time, and a bot commit on origin/trunk would make
  # every local trunk diverge on every release; a tag on no branch does
  # not, needs no skip-CI marker in its message, since a tag push starts no
  # run here, and cannot race anyone's push to trunk. (Never write that
  # marker, the words skip and ci in square brackets, in a commit message,
  # even to say it is not needed: GitHub starts no workflow at all for a
  # push whose head commit's message contains it anywhere, and a green
  # trunk commit then goes untested and unreleased until the next push.) So the last release is the tag's parent,
  # not an ancestor tag (scripts/last-release.sh, which release-due and the
  # notes ask). The child's workflows are its parent's, so the GITHUB_TOKEN
  # rule below about workflows applies to it as it would to the parent.
  #
  # The derived version makes every run a unique, monotonic release, so two
  # pushes cannot collide on a tag. A re-run of a run keeps its run number:
  # re-running one whose release was already made fails at the tag's push,
  # which never moves a tag, or at gh release create, which never
  # overwrites a release.
  release:
    needs: [check, race, fuzz-targets, fuzz, kill-soak, build, nix]
    if: >-
      always()
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && !contains(needs.*.result, 'skipped')
    runs-on: ubuntu-latest
    # One release at a time, never cancelled: a second run's release waits
    # for the first's, so it sees the first's tag (release-due, the notes).
    # A third waiting would replace the second, whose commits it includes.
    concurrency:
      group: release
      cancel-in-progress: false
    # A job that a cancellation cannot stop still has to end.
    timeout-minutes: 30
    permissions:
      contents: write
      # To start CI on trunk's head, where this commit cannot be tagged.
      actions: write
      # To attest every binary (D7, S1): an OIDC token, which Fulcio turns
      # into a certificate naming this workflow on trunk, and the right to
      # store the attestations with the repository's.
      id-token: write
      attestations: write
    # Every action in this job is pinned by commit, not by tag: the job
    # holds id-token: write, so any step's code could mint a Fulcio
    # certificate for exactly the identity gh attestation verify --repo
    # danielbodart/mosey trusts and attest a binary of its choosing.
    # A moved tag must not be able to do that. Nor, since this job attests
    # what the build job uploaded, may a moved tag there (the toolchain
    # mise-action installs, the bytes upload-artifact carries): so every
    # action in every workflow is pinned the same way, and
    # scripts/actions-pinned.sh (mise run check) refuses one that is not.
    # Bumping one is a reviewed change of its SHA; the comment says which
    # release it is. The tools
    # mise-action installs (mise.toml: Go, shellcheck, actionlint, pinned
    # by exact version) run here too and are trusted the same way.
    #
    # Every step's if: starts with !failure(), never the implicit
    # success(), so a cancellation of the run lets it go on (see
    # concurrency, at the top) while a failure here still stops the rest.
    steps:
      # fetch-depth: 0 because the minor is the commit count, which
      # scripts/version.sh REFUSES to count in a shallow clone; fetch-tags so
      # the previous tags, and the commits they name off trunk, are here,
      # for release-due and the notes below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !failure() }}
        with:
          fetch-depth: 0
          fetch-tags: true

      # For mise run release-due.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        if: ${{ !failure() }}

      # The build job's four binaries, one directory per artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !failure() }}
        with:
          path: artifacts
          pattern: mosey-*

      # Whether to release, and if so the assets, laid out and checked.
      #
      # GitHub refuses GITHUB_TOKEN, which can never hold the workflows
      # permission, a new ref whose .github/workflows differ from trunk's
      # head ("HTTP 403: Resource not accessible by integration"): a tag of
      # this commit, once trunk has moved on to a commit that changed a
      # workflow, would be one. Then the release is trunk head's to make,
      # its commits including this one's: its own run makes it, or, where it
      # has none (a [skip ci] push, a push made with GITHUB_TOKEN), one
      # started here.
      - name: Decide, and lay out the assets
        if: ${{ !failure() }}
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.release || false }}
        run: |
          if [ "$FORCE" != true ] && ! mise run release-due; then
            echo "Nothing a release is built from changed since the last release: no release."
            exit 0
          fi
          git fetch -q origin trunk
          head=$(git rev-parse FETCH_HEAD)
          if [ "$head" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" "$head" -- .github/workflows; then
            echo "::warning::trunk is at ${head:0:7}, which changed a workflow since ${GITHUB_SHA:0:7}: GITHUB_TOKEN cannot tag ${GITHUB_SHA:0:7}, so the release is ${head:0:7}'s"
            if [ "$(gh run list --workflow ci.yml --commit "$head" --json databaseId --jq length)" = 0 ]; then
              gh workflow run ci.yml --ref trunk -f release="$FORCE"
            fi
            exit 0
          fi
          V="$(./scripts/version.sh)"
          scripts/release-assets.sh "$V" release artifacts
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # SLSA build provenance for each binary (D7, S1, bootstrap.md §4.6),
      # one attestation per binary so each names exactly one asset. Signed
      # by the public-good Sigstore (the repository is public): a Fulcio
      # certificate for this workflow on refs/heads/trunk, logged in Rekor.
      # GitHub stores the attestations; they are not release assets, and
      # nothing in mosey checks them: they are for gh attestation verify
      # FILE --repo danielbodart/mosey, by hand (D7 as amended 2026-11-15).
      # Pinned by commit, as is every action in this job. A failure here
      # fails the job, so nothing below runs and no unattested binary is
      # published.
      - name: Attest linux/amd64
        if: ${{ !failure() && steps.due.outputs.version != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/mosey-${{ steps.due.outputs.version }}-linux-amd64
      - name: Attest linux/arm64
        if: ${{ !failure() && steps.due.outputs.version != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/mosey-${{ steps.due.outputs.version }}-linux-arm64
      - name: Attest darwin/amd64
        if: ${{ !failure() && steps.due.outputs.version != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/mosey-${{ steps.due.outputs.version }}-darwin-amd64
      - name: Attest darwin/arm64
        if: ${{ !failure() && steps.due.outputs.version != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/mosey-${{ steps.due.outputs.version }}-darwin-arm64

      # Notes from the COMMITS since the last release, written before this
      # release's tag exists, so the last release is the one before it.
      # Trunk-based means direct pushes and no pull requests, so GitHub's
      # PR-based --generate-notes would come out empty. On the first release
      # there is no prior tag, so fall back to the head commit rather than
      # dumping the whole history.
      - name: Release notes
        if: ${{ !failure() && steps.due.outputs.version != '' }}
        run: |
          if read -r _ prev < <(scripts/last-release.sh); then
            git log "$prev..$GITHUB_SHA" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)' "$GITHUB_SHA"; } > notes.md
          fi
          {
            echo
            echo "Static binaries for linux and darwin on amd64 and arm64, each with a GitHub build attestation."
            echo "To check what you downloaded: sha256sum --ignore-missing -c SHA256SUMS, and gh attestation verify FILE --repo danielbodart/mosey"
            echo "With Nix: nix run github:danielbodart/mosey/v$V -- HOST"
          } >> notes.md
        env:
          V: ${{ steps.due.outputs.version }}

      # The tag, on its own commit (see the top of this job): nix/release.json
      # for the binaries laid out above, committed on a detached HEAD whose
      # parent is the commit this run tested, and only the tag pushed.
      - name: Tag v<V> on a child commit holding nix/release.json
        if: ${{ !failure() && steps.due.outputs.version != '' }}
        env:
          V: ${{ steps.due.outputs.version }}
        run: |
          git checkout -q --detach "$GITHUB_SHA"
          mkdir -p nix
          scripts/release-json.sh "$V" release/SHA256SUMS > nix/release.json
          cat nix/release.json
          git add nix/release.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Release v$V" \
              -m "nix/release.json, for flake.nix: the release's version and each binary's URL and hash. This commit is on no branch; only the tag v$V names it."
          git tag "v$V"
          git push -q origin "refs/tags/v$V"

      # The release, on the tag just pushed (--verify-tag: never one GitHub
      # would make itself, on trunk).
      - name: Create GitHub Release
        if: ${{ !failure() && steps.due.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.due.outputs.version }}
        run: gh release create "v$V" --verify-tag --title "v$V" --notes-file notes.md release/*
